<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Seoul Bike Demand Assistant</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 2rem; background: #f5f7fa; color: #333; }
        .card { background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 1.5rem; max-width: 600px; margin-left: auto; margin-right: auto; }
        h2 { margin-top: 0; color: #2c3e50; text-align: center; }
        .form-group { margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }
        label { font-weight: bold; width: 40%; }
        select, input { padding: 0.5rem; font-size: 1rem; border-radius: 4px; border: 1px solid #ccc; width: 55%; box-sizing: border-box; }
        button { width: 100%; padding: 0.75rem; background: #2ecc71; color: white; border: none; border-radius: 4px; font-size: 1.1rem; cursor: pointer; font-weight: bold; margin-top: 1rem; }
        button:hover { background: #27ae60; }
        .result-container { text-align: center; margin-top: 1.5rem; padding: 1rem; background: #e8f8f5; border-radius: 6px; border: 1px solid #a3e4d7; }
        #prediction-result { font-size: 1.8rem; color: #16a085; font-weight: bold; }
    </style>
</head>
<body>
    <div class='card'>
        <h2>Seoul Bike Demand Dynamic Predictor</h2>
        <p style='text-align: center; color: #7f8c8d;'>Powered by an in-browser Random Forest Model (bike_model.js)</p>

        <div class='form-group'>
            <label for='hour'>Hour (0-23):</label>
            <input type='number' id='hour' min='0' max='23' value='12'>
        </div>

        <div class='form-group'>
            <label for='temp'>Temperature (°C):</label>
            <input type='number' id='temp' step='0.1' value='20.0'>
        </div>

        <div class='form-group'>
            <label for='humidity'>Humidity (%):</label>
            <input type='number' id='humidity' min='0' max='100' value='50'>
        </div>

        <div class='form-group'>
            <label for='wind'>Wind Speed (m/s):</label>
            <input type='number' id='wind' step='0.1' value='1.5'>
        </div>

        <div class='form-group'>
            <label for='rain'>Rainfall (mm):</label>
            <input type='number' id='rain' step='0.1' value='0.0'>
        </div>

        <div class='form-group'>
            <label for='snow'>Snowfall (cm):</label>
            <input type='number' id='snow' step='0.1' value='0.0'>
        </div>

        <div class='form-group'>
            <label for='weekend'>Day Type:</label>
            <select id='weekend'>
                <option value='0'>Weekday</option>
                <option value='1'>Weekend</option>
            </select>
        </div>

        <div class='form-group'>
            <label for='holiday'>Holiday:</label>
            <select id='holiday'>
                <option value='0'>No Holiday</option>
                <option value='1'>Holiday</option>
            </select>
        </div>

        <div class='form-group'>
            <label for='season'>Season:</label>
            <select id='season'>
                <option value='Summer'>Summer</option>
                <option value='Spring'>Spring</option>
                <option value='Autumn'>Autumn</option>
                <option value='Winter'>Winter</option>
            </select>
        </div>

        <button onclick='calculateLivePrediction()'>Run Model Live</button>

        <div class='result-container'>
            <h3>Estimated Demand: <span id='prediction-result'>-</span> bikes/hour</h3>
        </div>
    </div>

    <!-- Load our pre-compiled Javascript ML Model -->
    <script src='bike_model.js'></script>

    <script>
        function calculateLivePrediction() {
            const hour = parseFloat(document.getElementById('hour').value) || 0;
            const temp = parseFloat(document.getElementById('temp').value) || 0;
            const humidity = parseFloat(document.getElementById('humidity').value) || 0;
            const wind = parseFloat(document.getElementById('wind').value) || 0;
            const rain = parseFloat(document.getElementById('rain').value) || 0;
            const snow = parseFloat(document.getElementById('snow').value) || 0;
            const weekend = parseFloat(document.getElementById('weekend').value);
            const holiday = parseFloat(document.getElementById('holiday').value);
            const season = document.getElementById('season').value;

            // Build seasonal features matching our model feature array order
            const isAutumn = season === 'Autumn' ? 1.0 : 0.0;
            const isSpring = season === 'Spring' ? 1.0 : 0.0;
            const isSummer = season === 'Summer' ? 1.0 : 0.0;
            const isWinter = season === 'Winter' ? 1.0 : 0.0;

            // Must strictly match the WEB_FEATURES array order used during train:
            // ['hour', 'temperature', 'humidity', 'wind_speed', 'rainfall', 'snowfall', 
            //  'is_weekend', 'holiday_flag', 'season_Autumn', 'season_Spring', 'season_Summer', 'season_Winter']
            const inputFeatures = [
                hour, temp, humidity, wind, rain, snow, 
                weekend, holiday, isAutumn, isSpring, isSummer, isWinter
            ];

            try {
                // score() is the global function exported inside bike_model.js
                const prediction = score(inputFeatures);
                const finalResult = Math.max(0, Math.round(prediction));
                document.getElementById('prediction-result').innerText = finalResult.toLocaleString();
            } catch (err) {
                console.error(err);
                alert('Make sure bike_model.js is loaded successfully!');
            }
        }
    </script>
</body>
</html>
